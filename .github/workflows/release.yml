# Every push to main: run the tests, build AssetLab.exe and the update package, and publish them as a release.
# Installed copies of Asset Lab find the newest release on their next start (when the repository is public).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # build attestations: proof that GitHub built these files from this repository's code
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}   # optional; a step's own env is not visible to its if, so it lives here
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the lab's two packages
        shell: pwsh
        run: |
          python -m pip install numpy==2.5.4 pillow==12.3.0 soundfile==0.14.0 *> ci-install.log
          $code = $LASTEXITCODE; Get-Content ci-install.log; exit $code

      - name: Test
        shell: pwsh
        env:
          PYTHONPATH: src;tests
        run: |
          python -B -X utf8 -m unittest discover -v -s tests *> ci-test.log
          $code = $LASTEXITCODE; Get-Content ci-test.log; exit $code

      - name: Browser tests
        shell: pwsh
        env:
          PYTHONPATH: src;tests
          ASSET_LAB_REQUIRE_BROWSER: '1'
        run: |
          python -B -X utf8 -m unittest discover -v -s tests/browser *> ci-browser.log
          $code = $LASTEXITCODE; Get-Content ci-browser.log
          # Failing tests as annotations: readable on the run page without signing in to download the logs.
          # Each failure's whole report (traceback and browser errors) as one annotation, lines joined with %0A.
          $lines = @(Get-Content ci-browser.log); $shown = 0
          for ($i = 0; $i -lt $lines.Count -and $shown -lt 12; $i++) {
            if ($lines[$i] -notmatch '^(FAIL|ERROR): ') { continue }
            $block = @()
            for ($j = $i; $j -lt $lines.Count -and $j -lt $i + 60; $j++) {
              if ($j -gt $i -and $lines[$j] -match '^(={20,}|Ran \d+ tests?)') { break }
              if ($lines[$j] -notmatch '^-{20,}$' -and $lines[$j].Trim()) { $block += $lines[$j] }
            }
            $text = $block -join '%0A'; if ($text.Length -gt 3500) { $text = $text.Substring(0, 3500) }
            "::error title=Browser test::$text"; $shown++
          }
          exit $code

      - name: Keep browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            ci-browser.log
            tests/browser/output/

      - name: Build
        shell: pwsh
        run: |
          $base = ((Get-Content VERSION -Raw).Trim().Split('.')[0..1]) -join '.'
          $version = "$base.${{ github.run_number }}"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          try { & ./tools/build_release.ps1 -Version $version -Repository '${{ github.repository }}' *> ci-build.log; $code = 0 }
          catch { ($_ | Out-String) + $_.ScriptStackTrace | Add-Content ci-build.log; $code = 1 }
          Get-Content ci-build.log; exit $code

      # The notes are the commit message without any attribution trailers (Co-Authored-By, "Generated with …").
      # It is read from the environment, never pasted into the script, so its text can't run as code.
      # Anyone can check that AssetLab.exe was built here, by GitHub, from the public code (not on someone's PC):
      # the release's Attestations, or `gh attestation verify AssetLab.exe -R <this repo>`.
      - name: Prove where the files came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/AssetLab.exe
            dist/asset-lab-app.zip

      # Optional: with a free VirusTotal API key saved as the VT_API_KEY secret, every build is scanned there, so the
      # link in the notes shows the result at once. Without the secret this step does nothing.
      - name: Scan on VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        shell: pwsh
        run: |
          curl.exe -s --fail -H "x-apikey: $env:VT_API_KEY" -F "file=@dist/AssetLab.exe" https://www.virustotal.com/api/v3/files | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::VirusTotal did not take the file this time; the link still works once it is scanned.' }

      - name: Release notes
        shell: pwsh
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          $lines = $env:MESSAGE -split "`r?`n" | Where-Object { $_ -notmatch '^\s*(co-authored-by:|signed-off-by:.*noreply@anthropic|.*generated with \[?claude)' }
          $sha = (Get-FileHash dist/AssetLab.exe -Algorithm SHA256).Hash.ToLower()
          $safe = @(
            '', '---', '### Is it safe?',
            "- **Built by GitHub from the public code.** This file was built on GitHub's servers from [this repository's source](https://github.com/$env:REPO), not on anyone's PC. [Check the build attestation](https://github.com/$env:REPO/attestations).",
            "- **Same file as here:** SHA-256 ``$sha``. [VirusTotal scan of this exact file](https://www.virustotal.com/gui/file/$sha).",
            '- **Why Windows warns:** the app is new and not code-signed yet, so SmartScreen shows "Windows protected your PC" (More info > Run anyway). It does not need administrator rights, backs up every game file before changing it, and Restore original puts them back.')
          (($lines -join "`n").Trim() + "`n" + ($safe -join "`n")) | Out-File release-notes.md -Encoding utf8

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Asset Lab ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/AssetLab.exe
            dist/asset-lab-app.zip

      # When something fails, keep the logs on a ci-logs branch so they can be read with plain git.
      - name: Save logs
        if: failure()
        shell: pwsh
        run: |
          git config user.name 'Asset Lab CI'
          git config user.email 'ci@users.noreply.github.com'
          $logs = Get-ChildItem ci-*.log -ErrorAction SilentlyContinue
          New-Item -ItemType Directory ci-logs -Force | Out-Null
          $logs | Copy-Item -Destination ci-logs
          "run ${{ github.run_number }} on $(Get-Date -Format s)" | Out-File ci-logs/run.txt
          git checkout --orphan ci-logs
          git rm -rf --cached . *> $null
          git add -f ci-logs
          git commit -m "CI logs for run ${{ github.run_number }}"
          git push -f origin ci-logs
